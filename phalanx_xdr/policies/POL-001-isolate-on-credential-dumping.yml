# Phalanx automated response policy
# ─────────────────────────────────────────────────────────────────────────────
# When a Sentinel agent reports a credential-dumping tool (PHX-001), isolate
# the host immediately. This is the highest-impact automated response and the
# most defensible — credential dumping is unambiguous, and isolation only
# blocks attacker C2; the host stays online for the SOC to investigate.

id:    POL-001
title: Auto-isolate on credential dumping
description: |
  Critical-severity alerts for credential dumping tools (mimikatz, lsadump,
  gsecdump, pwdump, et al) trigger immediate network isolation. The host
  remains reachable from the Phalanx manager IP for forensics; all other
  network access is cut via iptables.

enabled: true
dry_run: false        # if true, the engine logs the action but doesn't fire it

# What alerts this policy reacts to. All conditions must match.
match:
  rule_ids:
    - PHX-001
  severity:
    - Critical

# What to do when matched. The engine POSTs to /api/v1/response/issue.
action:
  type: isolate_host
  params:
    allow_ip: 10.42.0.1    # the gateway VM acting as Phalanx manager

# Rate-limiting prevents an alert storm from issuing 100 isolation commands
# in 10 seconds. Once a host has been isolated, additional matching alerts
# within the window are recorded but skipped.
rate_limit:
  per_host: "1 per 5m"
